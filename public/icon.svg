<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#182338"/>
      <stop offset="100%" stop-color="#07090f"/>
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="100%" stop-color="#a80036"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Koala Ears -->
  <circle cx="160" cy="180" r="54" fill="#141c2c" stroke="#00f0ff" stroke-width="6"/>
  <circle cx="160" cy="180" r="32" fill="url(#roseGrad)"/>

  <circle cx="352" cy="180" r="54" fill="#141c2c" stroke="#00f0ff" stroke-width="6"/>
  <circle cx="352" cy="180" r="32" fill="url(#roseGrad)"/>

  <!-- Koala Head Chassis -->
  <rect x="144" y="150" width="224" height="190" rx="40" fill="#0c111a" stroke="#00f0ff" stroke-width="6" filter="url(#neonGlow)"/>

  <!-- Koala Big Oval Nose (Beat Encoder) -->
  <ellipse cx="256" cy="245" rx="36" ry="48" fill="#00f0ff" />
  <circle cx="256" cy="245" r="14" fill="#07090f" />

  <!-- 4x4 Beat Pads Grid at the bottom -->
  <g transform="translate(140, 360)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="50" height="42" rx="8" fill="url(#cyanGrad)"/>
    <rect x="60" y="0" width="50" height="42" rx="8" fill="url(#roseGrad)"/>
    <rect x="120" y="0" width="50" height="42" rx="8" fill="url(#cyanGrad)"/>
    <rect x="180" y="0" width="50" height="42" rx="8" fill="url(#roseGrad)"/>
    <!-- Row 2 -->
    <rect x="0" y="52" width="50" height="42" rx="8" fill="url(#roseGrad)"/>
    <rect x="60" y="52" width="50" height="42" rx="8" fill="url(#cyanGrad)"/>
    <rect x="120" y="52" width="50" height="42" rx="8" fill="url(#roseGrad)"/>
    <rect x="180" y="52" width="50" height="42" rx="8" fill="url(#cyanGrad)"/>
  </g>
</svg>
